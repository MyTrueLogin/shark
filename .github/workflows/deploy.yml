name: Build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  # Server over SSH: runs only when the SSH_HOST secret is set
  server:
    needs: build
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
    steps:
      - name: Skip when the server is not configured
        if: env.SSH_HOST == ''
        run: echo "SSH_HOST secret is not set — server deploy skipped."
      - if: env.SSH_HOST != ''
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Rsync to server
        if: env.SSH_HOST != ''
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          install -m 700 -d ~/.ssh
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          if [ -n "$SSH_PASSWORD" ]; then
            # вхід за паролем (SSH_PASSWORD)
            sudo apt-get install -y -qq sshpass >/dev/null
            export SSHPASS="$SSH_PASSWORD"
            RSH="sshpass -e ssh -p $SSH_PORT -o PreferredAuthentications=password -o PubkeyAuthentication=no"
          else
            # вхід за ключем (SSH_KEY)
            printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
            RSH="ssh -i $HOME/.ssh/id_deploy -p $SSH_PORT"
          fi
          rsync -az --delete -e "$RSH" dist/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
